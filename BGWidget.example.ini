; BGWidget example configuration
; Copy this file to BGWidget.ini and place it beside BGWidget.exe.
; Do NOT commit your real BGWidget.ini if it contains your private LAN/VPN address.

[Main]
; Base URL for Juggluco's HTTP server. Do not include /x/stream here.
DataPath=http://YOUR_PHONE_IP:17580

; Current glucose polling interval, in seconds.
GetGlucoseInterval=60

; Recalculate the long-term average/A1c values every N minutes.
IntervalToCalculateA1cInMinutes=60

ShowGlucose=True
ShowAverageGlucose=True
ShowA1c=True
ShowDaysOfRecords=True
ShowLastUpdate=True
UseRelativeTime=True

[GlucoseColor]
FontColor=FFFFFF

[hbA1cColor]
FontColor=FFFFFF

[DaysOfRecordsColor]
FontColor=FFFFFF

[LastUpdateColor]
FontColor=FFFFFF

[HistoryGraph]
Show=True
Hours=12
MinGlucose=40
MaxGlucose=300
LineColor=00FF00
GridColor=404040
LineWidth=2

[Placement]
; Monitor may be a display number or "all".
Monitor=1

; Valid positions: topleft, topright, bottomleft, bottomright, center
Position=topright
MarginX=20
MarginY=20
